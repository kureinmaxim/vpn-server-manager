<link rel="stylesheet" href="{{ url_for('static', filename='css/dns.css') }}?v={{ app_info.get('version', '') }}">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
    {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="{{ _('Закрыть') }}"></button>
</div>
{% endfor %}
{% endwith %}
