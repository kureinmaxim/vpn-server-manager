<div class="card-footer server-actions">
    <a class="btn server-action server-action-icon" href="{{ url_for('main.edit_server', server_id=server.id) }}" title="{{ _('Редактировать') }}" aria-label="{{ _('Редактировать') }}"><i class="bi bi-pencil-square" aria-hidden="true"></i></a>
    <button type="button" class="btn server-action server-action-status btn-show-stats" title="{{ _('Статус') }}" aria-label="{{ _('Статус') }}" data-server-id="{{ server.id }}" data-server-name="{{ server.name }}" data-server-ip="{{ server.ip_address }}"><i class="bi bi-activity" aria-hidden="true"></i><span class="server-action-label">{{ _('Статус') }}</span></button>
    <a class="btn server-action" title="{{ _('Мониторинг VPS') }}" aria-label="{{ _('Мониторинг VPS') }}" href="{{ url_for('main.monitoring', server_id=server.id) }}"><i class="bi bi-bar-chart-line" aria-hidden="true"></i><span class="server-action-label">{{ _('Мониторинг VPS') }}</span></a>
    <div class="dropdown server-actions-more">
        <button type="button" class="btn server-action server-action-menu-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="{{ _('Действия с сервером') }}" title="{{ _('Действия с сервером') }}"><span>{{ _('Действия') }}</span><span aria-hidden="true">⌄</span></button>
        <ul class="dropdown-menu dropdown-menu-end server-actions-menu">
            <li><a class="dropdown-item" href="{{ url_for('reset.disk_page', server_id=server.id) }}"><i class="bi bi-hdd" aria-hidden="true"></i>{{ _('Проверить место на диске') }}</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="{{ url_for('reset.reset_page', server_id=server.id) }}"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>{{ _('Очистить стек') }}</a></li>
            <li><a class="dropdown-item" href="{{ url_for('reset.archive_page', server_id=server.id) }}"><i class="bi bi-archive" aria-hidden="true"></i>{{ _('Удалить архив') }}</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><form action="{{ url_for('main.delete_server', server_id=server.id) }}" method="post" data-confirm-message="{{ _('Вы уверены, что хотите удалить этот сервер?') }}" onsubmit="return confirm(this.getAttribute('data-confirm-message'));">
                <button type="submit" class="dropdown-item text-danger"><i class="bi bi-trash" aria-hidden="true"></i>{{ _('Удалить сервер') }}</button>
            </form></li>
        </ul>
    </div>
</div>
