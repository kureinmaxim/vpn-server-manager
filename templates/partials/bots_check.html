<div class="modal fade" id="botsCheckModal" tabindex="-1" aria-labelledby="botsCheckTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="botsCheckTitle"><i class="bi bi-robot me-2" aria-hidden="true"></i>{{ _('Telegram-боты на узлах') }}</h5>
                    <p class="small text-body-secondary mb-0 mt-1">{{ _('Только метаданные по SSH. Токены и настройки ботов не читаются.') }}</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ _('Закрыть') }}"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                    <div id="bots-check-progress" class="small" role="status" aria-live="polite"></div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('main.tracked_bots') }}" class="btn btn-sm btn-outline-secondary text-nowrap"><i class="bi bi-gear" aria-hidden="true"></i> {{ _('Настроить список') }}</a>
                        <button id="bots-check-refresh" type="button" class="btn btn-sm btn-outline-info text-nowrap"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> {{ _('Обновить') }}</button>
                    </div>
                </div>
                <div id="bots-check-nodes" class="d-flex flex-wrap gap-1 mb-2" aria-busy="false" aria-label="{{ _('Узлы') }}"></div>
                <div id="bots-check-errors" class="small text-warning-emphasis mb-2"></div>
                <div id="bots-check-senders" hidden></div>
                <p class="small text-body-secondary">{{ _('Боты без процесса не обнаруживаются: для них нельзя определить состояние запуска.') }}</p>
                <section class="mb-3" aria-labelledby="bots-check-process-title">
                    <h6 id="bots-check-process-title" class="mb-2"><i class="bi bi-cpu me-2" aria-hidden="true"></i>{{ _('Боты с процессом') }}</h6>
                    <div id="bots-check-process" aria-live="polite"></div>
                </section>
                <div id="bots-check-extra" class="small"></div>
                <p id="bots-check-mesh" class="small text-body-secondary mt-2 mb-0"></p>
            </div>
        </div>
    </div>
</div>
