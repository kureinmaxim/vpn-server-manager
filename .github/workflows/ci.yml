name: CI

on:
  push:
    branches: [ main, develop, 'codex/5.0-security-foundation' ]
  pull_request:
    branches: [ main ]
  # Позволяет запускать вручную
  workflow_dispatch:

# Ограничиваем количество одновременных runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Smoke check (зависимости ставятся, ключ генерируется)
      run: |
        python generate_key.py
      env:
        PYTHONIOENCODING: utf-8

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: HTTP security browser-layer tests
      run: node --test tests/js/http_security.test.cjs

    - name: Tests
      run: |
        pytest
      env:
        PYTHONIOENCODING: utf-8

  macos-build:
    name: macOS ARM packaged smoke
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.10.7'
        enable-cache: false
    - name: Confirm ARM runner
      run: test "$(uname -m)" = arm64
    - name: Build with isolated runtime and locked dependencies
      run: python3 tools/build_macos_compatible.py
    - name: Validate privacy and relocated runtime
      run: |
        .venv-macos/bin/python tools/check_public_files.py
        .venv-macos/bin/python -m tools.check_macos_artifact
    - name: Record verification evidence
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-verification-${{ github.sha }}
        path: |
          dist/macos-local/*-local.json
          dist/macos-local/check-report.json
        if-no-files-found: error
        retention-days: 10
