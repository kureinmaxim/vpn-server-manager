name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: I manage N servers and today I have to…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Mockups, examples, or how you work today.
